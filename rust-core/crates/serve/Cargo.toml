# mdv-serve — the MACHINE API daemon (TSK-653): MessagePack frames over a
# unix socket, per docs/REMOTE_PROTOCOL.md. NOT the human HTML server
# (that's mdv-web). std-only — zero external deps; the envelope codec is
# hand-rolled at the byte level. Depends on mdvcore-ffi (rlib) ONLY for the
# wire-version/capability constants so client and server can never drift.
[package]
name = "mdvcore-serve"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "mdvcore_serve"
path = "src/lib.rs"

[[bin]]
name = "mdv-serve"
path = "src/main.rs"

[dependencies]
mdvcore-core = { path = "../core" }
mdvcore-ffi = { path = "../ffi" }
# TSK-660: remote highlight (`highlight_runs`) — same grammars the app links.
mdvcore-highlight = { path = "../highlight" }
# Already a workspace dep (core uses it for the wire structs) — no new
# supply-chain surface.
serde = { workspace = true }

[lints.rust]
rust_2024_compatibility = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
string_slice = "deny"
panic = "deny"
# TSK-575: mirror the workspace cast deny-ratchet (this crate has LOCAL lints —
# it does not inherit the workspace set). The one cast site (envelope push_uint,
# guarded v<0x80) carries a reasoned #[allow]; a new unjustified cast fails here.
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
module_name_repetitions = "allow"
allow_attributes_without_reason = "warn"
