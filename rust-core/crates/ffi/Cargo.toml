[package]
name = "mdvcore-ffi"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
description = "extern \"C\" boundary for the MarkdownViewer Rust core. The only crate with unsafe + symbol exports."
build = "build.rs"

# cdylib  → the .dylib the Mac app embeds in Contents/Frameworks/.
# staticlib → the .a for lipo/xcframework static linking.
# rlib    → so `cargo test` and the cross-language Rust harness can link it.
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

# NOTE: this crate deliberately does NOT do `lints.workspace = true`.
# Mixing workspace-inherited lints with package-local ones is a hard error
# (cargo #13157), and this crate must opt OUT of `unsafe_code = "forbid"`
# because the C ABI lives here. Lints are defined locally below + at the crate
# root in src/lib.rs.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# No-panic enforcement on the C ABI edge. These four are clippy RESTRICTION
# lints (NOT in the `all`/pedantic/correctness groups) so they fire only where
# opted in — they are NOT covered by `all = deny` above. This crate opts OUT of
# workspace lint inheritance (cargo #13157), so unlike `mdvcore-core` it does
# not get them for free; they must be re-declared here. A panic unwinding across
# the `extern "C"` boundary (outside `ffi_guard!`/`catch_unwind` — e.g. in a
# `Drop`) is UB, so the only unsafe crate is exactly where the no-panic policy
# matters most. Test-only allows are handled centrally in `../../clippy.toml`
# (`allow-{unwrap,expect,indexing-slicing}-in-tests = true`).
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"

[dependencies]
# Wire encode/decode lives entirely in mdvcore-core; this crate only moves
# opaque frame bytes across the C boundary (audit TSK-569 removed the unused
# serde/rmp-serde declarations so the manifest states the true supply chain).
mdvcore-core = { path = "../core" }
# TSK-660: tree-sitter highlighting enters the app capability surface
# (mdvcore_highlight_runs, MDV_CAP_HIGHLIGHT). This pulls the grammar crates'
# C objects into the staticlib — the deliberate trade that lets the Swift
# bundle's grammar dylibs retire once the host routes through this path.
mdvcore-highlight = { path = "../highlight" }

[build-dependencies]
cbindgen = { workspace = true }
