# cbindgen config — emit a C header (NOT C++; the default is C++) for the
# extern "C" surface. The header is generated by build.rs into
# `$OUT_DIR/mdvcore.h` AND copied to `include/mdvcore.h` next to the
# hand-written module.modulemap so SwiftPM's systemLibrary target can import it.

language = "C"
header = "/* Generated by cbindgen from mdvcore-ffi. DO NOT EDIT BY HAND. */"
include_guard = "MDVCORE_H"
pragma_once = true
autogen_warning = "/* This file is auto-generated. Regenerate via `cargo build` (build.rs runs cbindgen). */"
cpp_compat = true
tab_width = 4
documentation = true
documentation_style = "c99"

[export]
prefix = ""
# Emit the status enum and the opaque handle structs.
include = ["MdvStatus"]

[enum]
# Plain C enum (not enum class) so Swift imports it as a C enum.
rename_variants = "QualifiedScreamingSnakeCase"
prefix_with_name = false

[parse]
parse_deps = false

[fn]
# No args/return name munging; keep the symbols verbatim.
prefix = ""
