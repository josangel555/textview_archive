[package]
name = "mdvcore-core"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
description = "Pure, sans-IO CSV parse + filterable session state for the MarkdownViewer Rust core."

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
# find_engine (TSK-630): linear-time regex for the FindEngine port.
regex-lite = { workspace = true }
pulldown-cmark = { workspace = true }
# The wire module owns BOTH the serde-derived cross-language types AND the
# MessagePack codec + length-prefix framing (the "proto" role folded into core
# for the PoC). rmp-serde is therefore a real dependency, not dev-only.
rmp-serde = { workspace = true }
# TSK-399: memmem SIMD substring for hex_search_find (already in-tree, zero new surface).
memchr = { workspace = true }

[dev-dependencies]
# TSK-585: property-test lane (owner-approved 2026-06-27, dev-only).
proptest = { workspace = true }
