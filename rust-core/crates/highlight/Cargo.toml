[package]
name = "mdvcore-highlight"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false
license.workspace = true

# Source syntax highlighting for the rust-core FRONT-ENDS (TUI + web), TSK-257.
#
# This crate is DELIBERATELY separate from `mdvcore-core`:
#   - core is `#![forbid(unsafe_code)]`; tree-sitter grammar crates link C and
#     need `unsafe` FFI, so they can't live there.
#   - it is NOT in `default-members`, so it never enters the merge gate
#     (core + ffi) nor the macOS SwiftUI app build — same scoping as ratatui.
#
# Owner-approved deps (TSK-257 park: "Approve tree-sitter + full grammar set").
# Grammar crates are ABI-decoupled from the core via `tree-sitter-language`, so
# the core version doesn't have to match each grammar's build version.

[dependencies]
# Pinned exactly (minimal-deps posture).
tree-sitter = "=0.25.10"
tree-sitter-highlight = "=0.25.10"
# Grammar set — start small (json/rust/js) to land the integration; the rest of
# the SwiftUI app's 11 follow as their own increments.
tree-sitter-json = "=0.24.8"
tree-sitter-rust = "=0.24.0"
tree-sitter-javascript = "=0.25.0"

# Default rustc/clippy levels — the workspace deny-set (no-panic/unwrap) is for
# the sans-IO core, not this grammar-binding crate.
