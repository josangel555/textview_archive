<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor</title>
<!-- Strict CSP: no external loads, no eval beyond what CM6 itself
     uses (it doesn't). All script + style is inline / bundled. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data:;">
<link rel="stylesheet" href="codemirror.css">
<script src="codemirror.js"></script>
</head>
<body class="light">
<div id="editor"></div>
<script>
(function () {
  // CodeMirror surface — populated by codemirror.js (esbuild
  // --global-name=CM). Pull just the symbols we use to keep this
  // bootstrap readable.
  const {
    EditorState, EditorView, EditorSelection, Compartment, Transaction,
    keymap, lineNumbers, highlightActiveLine, highlightActiveLineGutter,
    drawSelection, dropCursor, rectangularSelection, crosshairCursor,
    defaultKeymap, history, historyKeymap, undo, redo, indentWithTab,
    searchKeymap, highlightSelectionMatches, openSearchPanel, closeSearchPanel,
    findNext, findPrevious, replaceNext, replaceAll,
    setSearchQuery, SearchQuery, getSearchQuery,
    syntaxHighlighting, defaultHighlightStyle, bracketMatching,
    HighlightStyle, tags,
    foldKeymap, foldGutter, indentOnInput, foldAll, unfoldAll,
    indentUnit, EditorStateTabSize,
    linter, lintGutter, setDiagnostics, forEachDiagnostic,
    markdown, javascript, python, json, oneDark,
    // Phase 4 (v2):
    StateField, StateEffect, foldService, gutter, GutterMarker,
    Decoration, ViewPlugin, WidgetType,
    // Vim mode (opt-in; owner-approved 2026-06-15). May be absent on a stale
    // bundle during a rolling upgrade — guarded at the use site (applySetVimMode).
    vim,
  } = window.CM;

  // Optional hoverTooltip from @codemirror/view — may not be present on
  // older bundles; fall back to inert when undefined.
  const hoverTooltip = window.CM.hoverTooltip;

  // Protocol version — must match Swift side `CMProtocol.currentVersion`.
  // Phase 4 bumped this to v2 to add:
  //   - JS → Swift `incrementalChange` (accumulated edit stream instead
  //     of the full doc text on every debounce).
  //   - Swift → JS `applyEdits`, `setFoldingRanges`, `setGutterMarkers`,
  //     `setIndentGuides`.
  // Swift accepts envelopes with v == currentVersion OR v == currentVersion - 1
  // for one release cycle, so a pre-v2 bundle still parses on the Swift
  // side until the app updates `Resources/codemirror/`.
  const PROTOCOL_VERSION = 2;
  const PROTOCOL_OLDEST_SUPPORTED = 1;

  // ---- bridge helpers --------------------------------------------------
  // postMessage to Swift via the registered WKScriptMessageHandler named
  // "mdvEditor". Every outbound payload is stamped with the protocol
  // version + a message type. Swift drops messages with mismatched `v`.
  function post(type, payload) {
    const body = Object.assign({ v: PROTOCOL_VERSION, type: type }, payload || {});
    try {
      window.webkit.messageHandlers.mdvEditor.postMessage(body);
    } catch (e) {
      // No bridge registered (e.g. opened in plain browser for dev) —
      // swallow silently. This file is fine to open directly for JS
      // iteration.
      // eslint-disable-next-line no-console
      console.log("mdvEditor bridge unavailable:", body);
    }
  }

  // Monotonic doc version — incremented on every applied transaction with
  // docChanged. Mirrored by Swift to detect / drop stale replies.
  let docVersion = 0;
  // Flag set while we're applying a Swift-driven setText so the
  // updateListener doesn't echo it back as a `change`.
  let suppressEmit = false;

  // Debounced change emitter. CM6 transactions can fire many times per
  // keystroke (composing edits, selection changes). 200 ms keeps Swift
  // off the hot path while staying responsive enough for dirty-dot UX.
  //
  // Phase 4 (v2): when `incrementalChangeMode` is on, we accumulate the
  // per-transaction `iterChangedRanges` deltas and ship them as
  // `incrementalChange` events instead of a full-text `change`. Saves
  // the per-emit doc allocation + IPC cost on large files (§15.2 of
  // the design doc). Swift can toggle off at any time via
  // `setIncrementalChange` — the next emit falls back to full-text.
  let changeTimer = null;
  let lastEmittedText = null;
  let incrementalChangeMode = true; // v2 default; degrades to full-text on drift
  // ChangeSet accumulator. Each per-transaction `tr.changes` is composed
  // onto this — the resulting set represents all edits since the last
  // emit, all expressed against the doc the last emit referenced.
  // Iterating it at emit time gives the `{from, to, insert}` batch Swift
  // applies to its mirror. `null` when no edits pending.
  let pendingChanges = null;
  function scheduleChangeEmit() {
    if (changeTimer) clearTimeout(changeTimer);
    changeTimer = setTimeout(emitChange, 200);
  }
  // emitChange(force):
  //   force === false (debounced keystroke flow): ship the accumulated
  //     incremental batch when in incrementalChangeMode, else a full
  //     `change`. The `text === lastEmittedText` short-circuit avoids
  //     re-posting an unchanged doc.
  //   force === true (drift recovery): Swift detected its mirror
  //     diverged from ours and asked (via `flushChanges`) for the
  //     canonical text. We MUST bypass the `lastEmittedText` guard —
  //     from JS's view nothing changed since the last emit, so the
  //     guard would no-op and leave Swift permanently diverged
  //     (EDIT-drift). A forced emit always posts a FULL v1 `change`
  //     (never an incremental batch): the whole point is to re-seed
  //     Swift's mirror with ground truth, and an incremental batch
  //     would re-apply against the very mirror we don't trust.
  function emitChange(force) {
    changeTimer = null;
    const text = view.state.doc.toString();
    if (!force && text === lastEmittedText) {
      pendingChanges = null;
      return;
    }
    if (!force && incrementalChangeMode && pendingChanges) {
      // Walk the composed ChangeSet to produce a flat batch of
      // {from, to, insert} entries — each in the pre-batch frame,
      // ordered by `fromA` ascending. That's exactly what Swift's
      // CMEditApplier expects.
      const edits = [];
      pendingChanges.iterChanges(function (fromA, toA, _fromB, _toB, inserted) {
        edits.push({ from: fromA, to: toA, insert: inserted.toString() });
      });
      pendingChanges = null;
      lastEmittedText = text;
      post("incrementalChange", {
        edits: edits,
        version: docVersion,
        contentLength: text.length,
      });
      return;
    }
    // Full-text path: forced drift-recovery, or non-incremental mode,
    // or no pending batch to ship incrementally.
    pendingChanges = null;
    lastEmittedText = text;
    post("change", { text: text, version: docVersion, contentLength: text.length });
  }
  function emitChangeImmediate() {
    if (changeTimer) { clearTimeout(changeTimer); changeTimer = null; }
    emitChange(false);
  }
  // Forced full-text re-emit, bypassing the unchanged-text guard. Wired
  // to the `flushChanges` dispatch so Swift's drift-recovery actually
  // gets a fresh canonical `change` (EDIT-drift fix).
  function flushChangesForced() {
    if (changeTimer) { clearTimeout(changeTimer); changeTimer = null; }
    emitChange(true);
  }

  // Compose this transaction's changes onto the running accumulator.
  // CM6's `ChangeSet.compose(other)` produces a single ChangeSet that,
  // when applied to the doc-before-A, yields doc-after-B — exactly
  // what we want to hand Swift as one batch.
  function accumulateChanges(tr) {
    if (!pendingChanges) {
      pendingChanges = tr.changes;
    } else {
      pendingChanges = pendingChanges.compose(tr.changes);
    }
  }

  // Cursor / selection / scroll: debounced separately so a held arrow
  // key doesn't flood the bridge. Numbers per design doc §15.1.
  let cursorTimer = null;
  function scheduleCursorEmit() {
    if (cursorTimer) clearTimeout(cursorTimer);
    cursorTimer = setTimeout(emitCursorAndSelection, 50);
  }
  function emitCursorAndSelection() {
    cursorTimer = null;
    const sel = view.state.selection;
    const head = sel.main.head;
    const line = view.state.doc.lineAt(head);
    post("cursorPositionChanged", {
      line: line.number,
      column: head - line.from,
      head: head,
      ranges: sel.ranges.length,
    });
    post("selectionChanged", {
      selection: sel.toJSON(),
      hasSelection: !sel.main.empty || sel.ranges.length > 1,
    });
  }

  let scrollTimer = null;
  function scheduleScrollEmit() {
    if (scrollTimer) clearTimeout(scrollTimer);
    scrollTimer = setTimeout(emitScroll, 100);
  }
  function emitScroll() {
    scrollTimer = null;
    const vp = view.viewport;
    const fromLine = view.state.doc.lineAt(vp.from).number;
    const toLine = view.state.doc.lineAt(Math.min(vp.to, view.state.doc.length)).number;
    post("scrollChanged", {
      top: Math.round(view.scrollDOM.scrollTop),
      left: Math.round(view.scrollDOM.scrollLeft),
      viewportFromLine: fromLine,
      viewportToLine: toLine,
    });
  }

  // ---- language picker -------------------------------------------------
  // Map a short string from Swift to a CM language extension. Anything
  // unknown falls through to "no language" (plain text + basic editing).
  function languageFor(lang) {
    switch ((lang || "").toLowerCase()) {
      case "markdown": case "md":     return markdown();
      case "javascript": case "js":   return javascript();
      case "typescript": case "ts":   return javascript({ typescript: true });
      case "jsx":                     return javascript({ jsx: true });
      case "tsx":                     return javascript({ jsx: true, typescript: true });
      case "python": case "py":       return python();
      case "json":                    return json();
      default:                        return [];
    }
  }

  // Compartments let us hot-swap configuration without rebuilding the
  // whole state. Per design doc §2.3 / §13: anything user-toggleable
  // must be wrapped in a compartment at create time, otherwise
  // reconfigure no-ops silently.
  const themeCompartment       = new Compartment();
  const langCompartment        = new Compartment();
  const editableCompartment    = new Compartment();
  const wrapCompartment        = new Compartment();
  const gutterCompartment      = new Compartment();
  const fontCompartment        = new Compartment();
  const indentCompartment      = new Compartment();
  const tabSizeCompartment     = new Compartment();
  const lintGutterCompartment  = new Compartment();
  const invisiblesCompartment  = new Compartment();
  // Phase 4 (v2): new compartments
  const foldServiceCompartment = new Compartment(); // LSP-driven fold ranges
  const diffGutterCompartment  = new Compartment(); // diff bars + blame swatches
  const indentGuidesCompartment = new Compartment(); // hand-rolled indent guides
  const vimCompartment         = new Compartment(); // vim mode (opt-in, off by default)

  // ---- show-invisibles decoration plugin ------------------------------
  // Toggled via `setShowInvisibles`. Renders middle-dot for spaces,
  // arrow for tabs, pilcrow at line breaks. Lightweight ViewPlugin —
  // re-decorates only the visible viewport, so cost stays bounded on
  // big docs. Compartment-wrapped so we can swap in/out at runtime.
  function buildInvisiblesPlugin() {
    const { Decoration, ViewPlugin, WidgetType } = window.CM;
    class InvWidget extends WidgetType {
      constructor(ch) { super(); this.ch = ch; }
      eq(o) { return o.ch === this.ch; }
      toDOM() {
        const e = document.createElement("span");
        e.className = "cm-invisible";
        e.textContent = this.ch;
        return e;
      }
      ignoreEvent() { return true; }
    }
    const SPACE = new InvWidget("·");   // middle dot
    const TAB   = new InvWidget("→");   // rightwards arrow
    const NL    = new InvWidget("¶");   // pilcrow
    function buildDecos(view) {
      const builder = [];
      for (const { from, to } of view.visibleRanges) {
        const text = view.state.doc.sliceString(from, to);
        for (let i = 0; i < text.length; i++) {
          const ch = text[i];
          const pos = from + i;
          if (ch === " ") {
            builder.push(Decoration.replace({ widget: SPACE }).range(pos, pos + 1));
          } else if (ch === "\t") {
            builder.push(Decoration.replace({ widget: TAB }).range(pos, pos + 1));
          } else if (ch === "\n") {
            builder.push(Decoration.widget({ widget: NL, side: -1 }).range(pos));
          }
        }
      }
      return Decoration.set(builder, true);
    }
    return ViewPlugin.fromClass(class {
      constructor(view) { this.decorations = buildDecos(view); }
      update(u) {
        if (u.docChanged || u.viewportChanged) {
          this.decorations = buildDecos(u.view);
        }
      }
    }, { decorations: v => v.decorations });
  }
  // Cached because building the plugin allocates Decoration objects.
  let invisiblesPluginCached = null;
  function invisiblesExtension(enabled) {
    if (!enabled) return [];
    if (!invisiblesPluginCached) invisiblesPluginCached = buildInvisiblesPlugin();
    return invisiblesPluginCached;
  }

  // ---- Phase 4 (v2): LSP fold ranges via foldService ------------------
  // A `foldService` is consulted by the fold gutter + `foldAll` command
  // to discover foldable regions. We maintain a sorted array of
  // `{from, to}` (UTF-16 doc offsets) shipped from Swift via
  // `setFoldingRanges`, and answer fold queries by binary-searching for
  // the first range whose `from` falls within the queried line. When
  // empty, the service returns `null` and CM6 falls back to language-
  // default fold heuristics.
  let lspFoldRanges = []; // [{from, to, kind?}]
  function buildFoldService() {
    return foldService.of(function (state, lineStart, lineEnd) {
      if (!lspFoldRanges.length) return null;
      // Binary search for the first range with `from` >= lineStart.
      let lo = 0, hi = lspFoldRanges.length;
      while (lo < hi) {
        const mid = (lo + hi) >>> 1;
        if (lspFoldRanges[mid].from < lineStart) lo = mid + 1; else hi = mid;
      }
      const r = lspFoldRanges[lo];
      if (r && r.from >= lineStart && r.from <= lineEnd && r.to > r.from) {
        return { from: r.from, to: r.to };
      }
      return null;
    });
  }
  function applySetFoldingRanges(msg) {
    const arr = Array.isArray(msg.ranges) ? msg.ranges : [];
    const docLen = view.state.doc.length;
    lspFoldRanges = arr
      .map(function (r) {
        const from = Math.max(0, Math.min(docLen, Number(r.from) || 0));
        const to = Math.max(from, Math.min(docLen, Number(r.to) || from));
        return { from: from, to: to, kind: r.kind };
      })
      .filter(function (r) { return r.to > r.from; })
      .sort(function (a, b) { return a.from - b.from; });
    // Reconfigure to force the fold gutter to re-query the service.
    view.dispatch({
      effects: foldServiceCompartment.reconfigure(buildFoldService()),
    });
  }

  // ---- Phase 4 (v2): diff / blame gutter markers ----------------------
  // Maps "added" | "removed" | "modified" | "blame" to a CSS class. The
  // CSS itself lives in codemirror.css; tweak there if visual treatment
  // changes. Per-line marker — we don't currently render multi-line
  // ranges (a multi-line diff is N markers on consecutive lines).
  const GUTTER_KIND_TO_CSS = {
    added:    "cm-diff-added",
    removed:  "cm-diff-removed",
    modified: "cm-diff-modified",
    blame:    "cm-blame-marker",
  };
  class DiffGutterMarker extends GutterMarker {
    constructor(kind, tooltip, color) {
      super();
      this.kind = kind;
      this.tooltip = tooltip || null;
      this.color = color || null;   // TSK-360: per-line blame heatmap tint
    }
    eq(other) {
      return other.kind === this.kind && other.tooltip === this.tooltip
          && other.color === this.color;
    }
    toDOM() {
      const el = document.createElement("span");
      el.className = GUTTER_KIND_TO_CSS[this.kind] || "cm-diff-unknown";
      if (this.tooltip) el.title = this.tooltip;
      if (this.color) el.style.background = this.color;  // line-age heatmap
      el.textContent = "";
      return el;
    }
  }
  // StateField holds the per-line marker map; the gutter reads from it
  // and remaps positions through edits so markers ride along as the user
  // types. Cleared via the same effect with an empty payload.
  const setGutterMarkersEffect = StateEffect.define();
  const gutterMarkersField = StateField.define({
    create() { return new Map(); }, // line(1-based) → DiffGutterMarker
    update(value, tr) {
      for (const e of tr.effects) {
        if (e.is(setGutterMarkersEffect)) value = e.value;
      }
      return value;
    },
  });
  function buildDiffGutter() {
    return [
      gutterMarkersField,
      gutter({
        class: "cm-diff-gutter",
        lineMarker(view, line) {
          const map = view.state.field(gutterMarkersField, false);
          if (!map) return null;
          const lineNum = view.state.doc.lineAt(line.from).number;
          return map.get(lineNum) || null;
        },
        initialSpacer: () => new DiffGutterMarker("modified", null),
      }),
    ];
  }
  function applySetGutterMarkers(msg) {
    const arr = Array.isArray(msg.markers) ? msg.markers : [];
    const map = new Map();
    for (const m of arr) {
      const lineNum = Number(m.line) || 0;
      if (lineNum < 1 || lineNum > view.state.doc.lines) continue;
      const kind = String(m.kind || "");
      if (!(kind in GUTTER_KIND_TO_CSS)) continue;
      map.set(lineNum, new DiffGutterMarker(kind, m.tooltip || null, m.color || null));
    }
    view.dispatch({ effects: setGutterMarkersEffect.of(map) });
  }

  // ---- Phase 4 (v2): indent guides ------------------------------------
  // Lightweight ViewPlugin — draws a thin vertical rule at each multiple
  // of the current `indentUnit` for every visible line. Decoration is
  // recomputed on docChanged / viewportChanged so cost stays bounded by
  // the viewport.
  class IndentGuideWidget extends WidgetType {
    constructor(depth, unitSize) {
      super(); this.depth = depth; this.unitSize = unitSize;
    }
    eq(o) { return o.depth === this.depth && o.unitSize === this.unitSize; }
    toDOM() {
      const wrap = document.createElement("span");
      wrap.className = "cm-indent-guides";
      wrap.style.display = "inline-block";
      wrap.style.width = (this.depth * this.unitSize) + "ch";
      // One ::before per depth level via inline boxes. Cheaper than
      // building N child spans for short indents (depth max ≤ 32).
      for (let i = 0; i < this.depth; i++) {
        const bar = document.createElement("span");
        bar.className = "cm-indent-guide";
        bar.style.display = "inline-block";
        bar.style.width = this.unitSize + "ch";
        bar.style.borderLeft = "1px solid currentColor";
        bar.style.opacity = "0.15";
        bar.style.height = "1.2em";
        bar.style.verticalAlign = "text-bottom";
        wrap.appendChild(bar);
      }
      return wrap;
    }
    ignoreEvent() { return true; }
  }
  function detectIndentUnitSize(state) {
    // Pull unit from the indentUnit facet; fall back to 2.
    try {
      // CM6 9.x: facet getter on @codemirror/language; we read the
      // resolved value from state.facet.
      const u = state.facet(indentUnit);
      return typeof u === "string" ? Math.max(1, u.length || 2) : 2;
    } catch { return 2; }
  }
  function buildIndentGuidesPlugin() {
    return ViewPlugin.fromClass(class {
      constructor(view) { this.decorations = this.compute(view); }
      update(u) {
        if (u.docChanged || u.viewportChanged) {
          this.decorations = this.compute(u.view);
        }
      }
      compute(view) {
        const unitSize = detectIndentUnitSize(view.state);
        const ranges = [];
        for (const { from, to } of view.visibleRanges) {
          let pos = from;
          while (pos <= to) {
            const line = view.state.doc.lineAt(pos);
            // Count leading spaces / tabs only — mixed treated as
            // unitSize-wide each.
            let depth = 0, i = 0;
            const text = line.text;
            while (i < text.length) {
              const ch = text.charCodeAt(i);
              if (ch === 0x20) {
                // Run of spaces = floor(count / unitSize)
                let runEnd = i;
                while (runEnd < text.length && text.charCodeAt(runEnd) === 0x20) runEnd++;
                depth += Math.floor((runEnd - i) / unitSize);
                i = runEnd;
              } else if (ch === 0x09) { depth += 1; i++; }
              else { break; }
            }
            if (depth > 0) {
              ranges.push(Decoration.widget({
                widget: new IndentGuideWidget(depth, unitSize),
                side: -1,
              }).range(line.from));
            }
            if (line.to === view.state.doc.length) break;
            pos = line.to + 1;
          }
        }
        return Decoration.set(ranges, true);
      }
    }, { decorations: v => v.decorations });
  }
  let indentGuidesPluginCached = null;
  function indentGuidesExtension(enabled) {
    if (!enabled) return [];
    if (!indentGuidesPluginCached) indentGuidesPluginCached = buildIndentGuidesPlugin();
    return indentGuidesPluginCached;
  }
  function applySetIndentGuides(msg) {
    view.dispatch({
      effects: indentGuidesCompartment.reconfigure(
        indentGuidesExtension(!!msg.enabled)),
    });
  }
  // Vim mode toggle (opt-in; owner-approved 2026-06-15). Reconfigures the
  // vim compartment: [vim()] when enabled, [] when off. `vim` may be absent
  // on a stale bundle mid-rolling-upgrade — degrade to a no-op + report,
  // never throw (the dispatch wrapper would otherwise post a dispatch error).
  function applySetVimMode(msg) {
    if (typeof vim !== "function") {
      post("errorOccurred", {
        phase: "setVimMode",
        message: "vim mode unavailable in this codemirror.js bundle",
      });
      return;
    }
    view.dispatch({
      effects: vimCompartment.reconfigure(msg.enabled ? [vim()] : []),
    });
  }

  // ---- Phase 4 (v2): apply incremental edits from Swift --------------
  // Reciprocal to the JS → Swift `incrementalChange` accumulator. Swift
  // ships a batch of {from, to, insert} edits in the pre-batch frame;
  // CM6 accepts that as a `changes` array on a single dispatch (one
  // undo step). `version` lets us drop stale batches.
  function applyApplyEdits(msg) {
    if (typeof msg.version === "number" && msg.version < docVersion) return;
    const arr = Array.isArray(msg.edits) ? msg.edits : [];
    if (!arr.length) return;
    const docLen = view.state.doc.length;
    const changes = arr
      .filter(function (e) {
        const f = Number(e.from);
        const t = Number(e.to);
        return Number.isFinite(f) && Number.isFinite(t) &&
               f >= 0 && t >= f && t <= docLen;
      })
      .map(function (e) {
        return {
          from: Number(e.from),
          to: Number(e.to),
          insert: String(e.insert || ""),
        };
      });
    if (!changes.length) return;
    suppressEmit = true;
    try {
      view.dispatch({
        changes: changes,
        annotations: Transaction.addToHistory.of(false),
      });
    } finally {
      suppressEmit = false;
    }
  }

  // Build an EditorView.theme(...) that just controls font-size.
  // Compartmented so a setFontSize swap doesn't fight with theme swap.
  function fontTheme(px, family) {
    // TSK-259: one compartment owns size + family so the two swaps never
    // fight. A null family keeps the bundle's default stack; a custom
    // family always falls back to the monospace stack (a missing font on
    // the system must not degrade to the browser's proportional default).
    const base = { fontSize: px + "px" };
    const scroller = { fontSize: px + "px", lineHeight: "1.45" };
    const gutters = { fontSize: px + "px" };
    if (family) {
      const stack = '"' + family + '", "SF Mono", Menlo, monospace';
      base.fontFamily = stack;
      scroller.fontFamily = stack;
      gutters.fontFamily = stack;
    }
    return EditorView.theme({
      "&": base,
      ".cm-scroller": scroller,
      ".cm-gutters":  gutters,
    });
  }

  // Custom Save keymap — intercepts ⌘S before the browser swallows it,
  // forwards to Swift, returns true to mark the binding handled (so the
  // browser's "save page" dialog never appears).
  const saveBinding = {
    key: "Mod-s",
    preventDefault: true,
    run: () => { emitChangeImmediate(); post("save", {}); return true; },
  };

  // updateListener — every transaction. Emit change / cursor / scroll
  // signals; bump docVersion on docChanged.
  const updateListener = EditorView.updateListener.of((update) => {
    if (update.docChanged) {
      docVersion += 1;
      if (!suppressEmit) {
        // Accumulate per-transaction change sets so the eventual
        // emit can ship the batched diff (v2) without an O(doc)
        // toString cost.
        for (const tr of update.transactions) {
          if (tr.docChanged) accumulateChanges(tr);
        }
        scheduleChangeEmit();
      } else {
        // Swift-driven setText is happening — drop any in-flight
        // accumulator so we don't ship our own setText back as an
        // incremental change diff.
        pendingChanges = null;
      }
    }
    if (update.selectionSet || update.docChanged) {
      scheduleCursorEmit();
    }
    if (update.viewportChanged || update.geometryChanged) {
      scheduleScrollEmit();
    }
  });

  // DOM scroll listener — CM's updateListener fires viewportChanged on
  // big scrolls but the user can scroll within a viewport without
  // triggering it. Attach a raw listener once the editor is mounted.
  function attachScrollListener() {
    view.scrollDOM.addEventListener("scroll", scheduleScrollEmit, { passive: true });
    view.contentDOM.addEventListener("blur", () => post("editorBlurred", {}));
    // Right-click → native NSMenu. JS preventDefault so WKWebView's
    // default browser menu never appears; Swift pops a real NSMenu at
    // the screen-coord we forward. See `CodeMirrorEditorView` ctxMenu
    // wiring (Phase 2 #40).
    view.contentDOM.addEventListener("contextmenu", function (e) {
      try {
        const pos = view.posAtCoords({ x: e.clientX, y: e.clientY }) ?? 0;
        const line = view.state.doc.lineAt(pos);
        const sel = view.state.selection.main;
        const selText = sel.empty ? "" : view.state.sliceDoc(sel.from, sel.to);
        post("contextMenuRequested", {
          pos: pos,
          line: line.number,
          character: pos - line.from,
          screenX: e.screenX,
          screenY: e.screenY,
          selection: selText,
          hasSelection: !sel.empty,
        });
      } catch (err) {
        post("errorOccurred", {
          phase: "contextmenu",
          message: String((err && err.message) || err),
        });
      }
      e.preventDefault();
      return false;
    });
    // Cmd-click → Go-to-Definition. Swift opens the target tab; no
    // reply needed back to JS. We only fire on a plain Cmd-click
    // (no shift, no alt) over the content surface.
    view.contentDOM.addEventListener("mousedown", function (e) {
      if (!e.metaKey || e.shiftKey || e.altKey || e.button !== 0) return;
      try {
        const pos = view.posAtCoords({ x: e.clientX, y: e.clientY });
        if (pos == null) return;
        const line = view.state.doc.lineAt(pos);
        post("requestDefinition", {
          pos: pos,
          line: line.number,
          character: pos - line.from,
        });
        e.preventDefault();
      } catch (err) {
        post("errorOccurred", {
          phase: "cmdclick",
          message: String((err && err.message) || err),
        });
      }
    });
  }

  // ---- hover (LSP) -----------------------------------------------------
  // CM6's hoverTooltip handles dwell timing (default ~300 ms), positioning,
  // and dismissal. We resolve the body asynchronously via a Swift round-
  // trip: post `requestHover` with a replyId, hold a promise, resolve on
  // matching `hoverResponse`. Result body is rendered as plain text +
  // inline-styled fenced-code blocks (no HTML injection — defense against
  // hostile LSP servers).
  const _pendingHovers = new Map(); // replyId → {resolve, reject}
  let _hoverSeq = 0;
  function _newHoverReplyId() {
    _hoverSeq += 1;
    return "h" + Date.now().toString(36) + "-" + _hoverSeq;
  }
  function requestHoverFromSwift(pos, line, character) {
    const id = _newHoverReplyId();
    const promise = new Promise(function (resolve) {
      _pendingHovers.set(id, resolve);
      // Safety timeout — if Swift never replies (LSP not running, server
      // hung), drop after 2 s so the promise doesn't leak.
      setTimeout(function () {
        if (_pendingHovers.has(id)) {
          _pendingHovers.delete(id);
          resolve(null);
        }
      }, 2000);
    });
    post("requestHover", {
      pos: pos, line: line, character: character, replyId: id,
    });
    return promise;
  }
  function resolveHoverResponse(msg) {
    const fn = _pendingHovers.get(msg.replyId);
    if (!fn) return;
    _pendingHovers.delete(msg.replyId);
    fn({
      contents: String(msg.contents || ""),
      from: Number(msg.from) || 0,
      to: Number(msg.to) || 0,
    });
  }
  function buildHoverExtension() {
    if (typeof hoverTooltip !== "function") return [];
    return hoverTooltip(async function (view, pos, side) {
      const line = view.state.doc.lineAt(pos);
      const result = await requestHoverFromSwift(
        pos, line.number, pos - line.from
      );
      if (!result || !result.contents) return null;
      return {
        pos: result.from || pos,
        end: result.to || pos,
        above: true,
        create: function () {
          const dom = document.createElement("div");
          dom.className = "cm-tooltip-hover-lsp";
          // textContent — no HTML, defense in depth even though LSP is
          // local-trust. We render fenced code blocks visually by
          // splitting on ``` markers and applying monospace via inline
          // <pre>/<code>; this matches our LSPMarkdownRenderer's
          // posture for the source-viewer.
          const parts = result.contents.split(/```/);
          for (let i = 0; i < parts.length; i++) {
            const chunk = parts[i];
            if (!chunk) continue;
            const node = (i % 2 === 1)
              ? document.createElement("pre")
              : document.createElement("span");
            if (i % 2 === 1) {
              // Strip optional language tag on the opening fence's first line.
              const idx = chunk.indexOf("\n");
              const body = idx >= 0 ? chunk.slice(idx + 1) : chunk;
              node.textContent = body;
              node.style.margin = "0";
              node.style.fontFamily = "ui-monospace, SFMono-Regular, Menlo, monospace";
              node.style.fontSize = "0.95em";
              node.style.whiteSpace = "pre-wrap";
            } else {
              node.textContent = chunk;
              node.style.whiteSpace = "pre-wrap";
            }
            dom.appendChild(node);
          }
          return { dom: dom };
        },
      };
    }, { hideOnChange: true });
  }
  const hoverCompartment = new Compartment();

  // Base extensions reused across instances. The order matters for
  // keymap priority (search/save before defaults so ⌘S / ⌘F win).
  function baseExtensions(initialLang, initialThemeDark, initialFontPx) {
    return [
      // Vim mode (opt-in). FIRST so vim's keymap takes precedence over the
      // default/search/save bindings when enabled. Empty (no-op) by default;
      // Swift toggles it via `setVimMode` once the View → Vim Mode pref is read.
      // ⌘-combos (⌘S save, ⌘F search) are NOT bound by vim, so they still win.
      vimCompartment.of([]),
      gutterCompartment.of([lineNumbers(), highlightActiveLineGutter(), foldGutter()]),
      // Multi-cursor (TSK-639): the facet that PERMITS >1 selection range.
      // With it, the built-ins light up: ⌥-click adds a caret, ⌘D
      // (searchKeymap's selectNextOccurrence) grows the selection set,
      // ⌥-drag makes rectangular selections. drawSelection() renders the
      // extra carets (the native-selection path can't).
      EditorState.allowMultipleSelections.of(true),
      rectangularSelection(),
      crosshairCursor(),
      drawSelection(),
      dropCursor(),
      history(),
      indentOnInput(),
      bracketMatching(),
      highlightActiveLine(),
      highlightSelectionMatches(),
      syntaxHighlighting(defaultHighlightStyle, { fallback: true }),
      keymap.of([
        saveBinding,
        ...searchKeymap,   // ⌘F open search, ⌘G next, ⇧⌘G prev
        ...historyKeymap,  // ⌘Z / ⇧⌘Z
        ...foldKeymap,
        indentWithTab,
        ...defaultKeymap,
      ]),
      updateListener,
      wrapCompartment.of(EditorView.lineWrapping),
      themeCompartment.of(initialThemeDark ? [oneDark] : []),
      langCompartment.of(languageFor(initialLang)),
      editableCompartment.of(EditorView.editable.of(true)),
      fontCompartment.of(fontTheme(initialFontPx || 13)),
      // indentUnit + tabSize are Facet-of-string / Facet-of-int. Default
      // to 2-space indent; Swift will override via setIndentation.
      indentCompartment.of(indentUnit.of("  ")),
      tabSizeCompartment.of(EditorStateTabSize.of(2)),
      // Lint gutter — markers in the gutter at lines with diagnostics.
      // The underlying field that `setDiagnostics` writes is installed
      // by `lintGutter()` itself; squiggles ride along automatically
      // once any diagnostic is present.
      lintGutterCompartment.of(lintGutter()),
      // Invisible-character display. Off by default; toggled via
      // setShowInvisibles. Wrapped in a Compartment so we can hot-swap.
      invisiblesCompartment.of([]),
      // LSP hover. Dwell-driven; resolves bodies via Swift round-trip.
      // Built once; the bridge response gating handles "no LSP for this
      // file" by returning null contents (popover never appears).
      hoverCompartment.of(buildHoverExtension()),
      // Phase 4 (v2): LSP-driven fold service. Empty `lspFoldRanges`
      // → service returns null, CM falls back to language defaults.
      foldServiceCompartment.of(buildFoldService()),
      // Phase 4 (v2): diff / blame gutter. Sits to the LEFT of the
      // line-numbers gutter by virtue of being listed first.
      diffGutterCompartment.of(buildDiffGutter()),
      // Phase 4 (v2): indent guides — off by default; toggled via
      // setIndentGuides.
      indentGuidesCompartment.of(indentGuidesExtension(false)),
    ];
  }

  // ---- editor instance -------------------------------------------------
  const initialState = EditorState.create({
    doc: "",
    extensions: baseExtensions("markdown", false, 13),
  });
  const view = new EditorView({
    state: initialState,
    parent: document.getElementById("editor"),
  });
  // Test/diagnostic handle (TSK-639): the WebView-lane suites drive the
  // live editor through this. Same exposure class as cmDispatch — the
  // page is local, sandboxed, and never loads remote content.
  window.__mdvView = view;
  attachScrollListener();

  // ---- Dispatch entry point (Swift → JS) -------------------------------
  // Single switch keeps the surface narrow + auditable. Swift side
  // serializes one CMOutboundMessage per evaluateJavaScript call into
  //     window.cmDispatch({...JSON...})
  // Returning a value (truthy) lets evaluateJavaScript's reply callback
  // confirm receipt.
  window.cmDispatch = function (msg) {
    if (!msg || typeof msg !== "object") return false;
    if (typeof msg.v !== "number" ||
        msg.v < PROTOCOL_OLDEST_SUPPORTED || msg.v > PROTOCOL_VERSION) {
      post("errorOccurred", {
        phase: "dispatch",
        message: "protocol version unsupported: got v=" + msg.v +
                 " want " + PROTOCOL_OLDEST_SUPPORTED + ".." + PROTOCOL_VERSION,
      });
      return false;
    }
    try {
      switch (msg.type) {
        case "setText":            applySetText(msg); break;
        case "appendText":         applyAppendText(msg); break;
        case "replaceRange":       applyReplaceRange(msg); break;
        case "setLanguage":        applySetLanguage(msg); break;
        case "setTheme":           applySetTheme(msg); break;
        case "setFontSize":        applySetFontSize(msg); break;
        case "setFontFamily":      applySetFontFamily(msg); break;
        case "setWordWrap":        applySetWordWrap(msg); break;
        case "setReadOnly":        applySetReadOnly(msg); break;
        case "setLineNumbers":     applySetLineNumbers(msg); break;
        case "setIndentation":     applySetIndentation(msg); break;
        case "gotoLine":           applyGotoLine(msg); break;
        case "insertAtCursor":     applyInsertAtCursor(msg); break;
        case "setSelection":       applySetSelection(msg); break;
        case "openSearch":         openSearchPanel(view); break;
        case "closeSearch":        closeSearchPanel(view); break;
        case "setSearchQuery":     applySetSearchQuery(msg); break;
        case "findNext":           applyFindStep(findNext); break;
        case "findPrev":           applyFindStep(findPrevious); break;
        case "replaceNext":        applyFindStep(replaceNext); break;
        case "replaceAll":         replaceAll(view); emitFindResult(); break;
        case "setDiagnostics":     applySetDiagnostics(msg); break;
        case "setShowInvisibles":  applySetShowInvisibles(msg); break;
        case "setVimMode":         applySetVimMode(msg); break;
        case "foldAll":            foldAll(view); break;
        case "unfoldAll":          unfoldAll(view); break;
        case "undo":               undo(view); break;
        case "redo":               redo(view); break;
        case "focus":              view.focus(); break;
        case "flushChanges":       flushChangesForced(); break;
        case "getDocument":
          post("requestReply", { replyId: msg.replyId, value: {
            text: view.state.doc.toString(), version: docVersion,
          }});
          break;
        case "getSelection":
          post("requestReply", { replyId: msg.replyId, value: view.state.selection.toJSON() });
          break;
        case "getScrollPosition":
          post("requestReply", { replyId: msg.replyId, value: {
            top: view.scrollDOM.scrollTop, left: view.scrollDOM.scrollLeft,
          }});
          break;
        case "hoverResponse":      resolveHoverResponse(msg); break;
        case "setSaveOnBlur":      /* Swift owns the policy; JS keeps posting editorBlurred */ break;
        // Phase 4 (v2) handlers
        case "applyEdits":         applyApplyEdits(msg); break;
        case "setFoldingRanges":   applySetFoldingRanges(msg); break;
        case "setGutterMarkers":   applySetGutterMarkers(msg); break;
        case "setIndentGuides":    applySetIndentGuides(msg); break;
        default:
          post("errorOccurred", {
            phase: "dispatch",
            message: "unknown message type: " + msg.type,
          });
          return false;
      }
      return true;
    } catch (err) {
      post("errorOccurred", {
        phase: "dispatch:" + msg.type,
        message: String((err && err.message) || err),
        stack: err && err.stack ? String(err.stack) : undefined,
      });
      return false;
    }
  };

  // ---- message handlers ------------------------------------------------

  // Replace the whole document. resetHistory=true uses view.setState so
  // ⌘Z can't reach back into the prior buffer (right semantics when
  // opening a different file in the same view). resetHistory=false uses
  // dispatch + Transaction.addToHistory.of(false), which is what
  // file-watcher external rewrites want — visible to the user but not
  // a user-undoable step.
  function applySetText(msg) {
    const text = msg.text || "";
    const current = view.state.doc.toString();
    if (current === text) return;
    lastEmittedText = text; // prevent echo back
    suppressEmit = true;
    try {
      if (msg.resetHistory) {
        view.setState(EditorState.create({
          doc: text,
          selection: msg.preserveSelection
            ? { anchor: Math.min(view.state.selection.main.anchor, text.length) }
            : { anchor: 0 },
          extensions: baseExtensions(
            currentLanguage, currentThemeDark, currentFontPx
          ),
        }));
        attachScrollListener();
      } else {
        const spec = {
          changes: { from: 0, to: view.state.doc.length, insert: text },
          annotations: Transaction.addToHistory.of(false),
        };
        if (msg.preserveSelection) {
          spec.selection = { anchor: Math.min(view.state.selection.main.anchor, text.length) };
        }
        view.dispatch(spec);
      }
    } finally {
      suppressEmit = false;
    }
  }

  function applyAppendText(msg) {
    const text = msg.text || "";
    if (!text) return;
    view.dispatch({
      changes: { from: view.state.doc.length, insert: text },
      annotations: Transaction.addToHistory.of(false),
    });
  }

  function applyReplaceRange(msg) {
    // Drop stale targeted edits — Swift's version must match what we
    // have. If we've advanced past their reference doc, the (from,to)
    // is no longer meaningful.
    if (typeof msg.version === "number" && msg.version < docVersion) return;
    view.dispatch({
      changes: { from: msg.from, to: msg.to, insert: msg.insert || "" },
    });
  }

  // Mirror compartment state Swift-side so setText(resetHistory) can
  // re-seed the new state with the same compartment values.
  let currentLanguage   = "markdown";
  let currentThemeDark  = false;
  let currentFontPx     = 13;

  function applySetLanguage(msg) {
    currentLanguage = msg.lang || "markdown";
    view.dispatch({ effects: langCompartment.reconfigure(languageFor(currentLanguage)) });
  }

  // TSK-602 ViewOnly↔Editor color parity. Swift ships the SyntaxTheme
  // palette (TokenKind rawValue / chrome key → "#RRGGBB") inside
  // setTheme; we build a HighlightStyle + chrome theme from it so the
  // editor colors EQUAL the source view's. Falls back to the legacy
  // oneDark/default pairing when no palette arrives (older Swift) or
  // the bundle predates the HighlightStyle/tags re-exports.
  let currentPalette = null;

  function paletteExtensions(palette, dark) {
    if (!palette || !HighlightStyle || !tags) return dark ? [oneDark] : [];
    const t = tags;
    const specs = [
      { tag: [t.keyword, t.moduleKeyword, t.controlKeyword,
              t.operatorKeyword, t.definitionKeyword], color: palette.keyword },
      { tag: [t.string, t.special(t.string), t.docString, t.character],
        color: palette.string },
      { tag: t.escape, color: palette.escape },
      { tag: t.regexp, color: palette.regex },
      { tag: [t.comment, t.lineComment, t.blockComment, t.docComment],
        color: palette.comment },
      { tag: [t.number, t.integer, t.float], color: palette.number },
      { tag: [t.typeName, t.className, t.namespace], color: palette.type },
      { tag: [t.function(t.variableName), t.function(t.propertyName),
              t.macroName, t.labelName], color: palette.function },
      { tag: [t.variableName, t.propertyName, t.name], color: palette.variable },
      { tag: [t.annotation, t.meta], color: palette.attribute },
      { tag: t.operator, color: palette.operator },
      { tag: [t.punctuation, t.separator, t.bracket], color: palette.punctuation },
      { tag: [t.standard(t.variableName), t.self, t.atom], color: palette.builtin },
      { tag: [t.constant(t.variableName), t.bool, t.null], color: palette.constant },
      { tag: t.heading, color: palette.heading, fontWeight: "bold" },
      { tag: [t.link, t.url], color: palette.link, textDecoration: "underline" },
      { tag: t.emphasis, color: palette.emphasis, fontStyle: "italic" },
      { tag: t.strong, color: palette.strong, fontWeight: "bold" },
      { tag: t.tagName, color: palette.tag },
      { tag: t.attributeName, color: palette.tagAttribute },
    ].filter((s) => typeof s.color === "string");
    const chrome = EditorView.theme({
      "&": { backgroundColor: palette.background, color: palette.defaultText },
      ".cm-content": { caretColor: palette.defaultText },
      ".cm-gutters": {
        backgroundColor: palette.gutterBackground,
        color: palette.gutterText,
        border: "none",
      },
    }, { dark: dark });
    return [chrome, syntaxHighlighting(HighlightStyle.define(specs))];
  }

  function applySetTheme(msg) {
    currentThemeDark = (msg.name === "dark");
    currentPalette = (msg.palette && typeof msg.palette === "object") ? msg.palette : null;
    document.body.className = currentThemeDark ? "dark" : "light";
    view.dispatch({
      effects: themeCompartment.reconfigure(
        paletteExtensions(currentPalette, currentThemeDark)),
    });
  }

  function applySetFontSize(msg) {
    const n = Math.max(6, Math.min(72, Number(msg.px) || 13));
    currentFontPx = n;
    view.dispatch({ effects: fontCompartment.reconfigure(fontTheme(n, currentFontFamily)) });
  }

  // TSK-259: the user-selected monospace family. Absent/empty family =
  // restore the bundle default.
  let currentFontFamily = null;
  function applySetFontFamily(msg) {
    currentFontFamily = (typeof msg.family === "string" && msg.family) ? msg.family : null;
    view.dispatch({ effects: fontCompartment.reconfigure(fontTheme(currentFontPx, currentFontFamily)) });
  }

  function applySetWordWrap(msg) {
    view.dispatch({
      effects: wrapCompartment.reconfigure(msg.enabled ? EditorView.lineWrapping : []),
    });
  }

  function applySetReadOnly(msg) {
    view.dispatch({
      effects: editableCompartment.reconfigure(EditorView.editable.of(!msg.enabled)),
    });
  }

  function applySetLineNumbers(msg) {
    view.dispatch({
      effects: gutterCompartment.reconfigure(
        msg.enabled ? [lineNumbers(), highlightActiveLineGutter(), foldGutter()] : [foldGutter()]
      ),
    });
  }

  function applySetIndentation(msg) {
    const size = Math.max(1, Math.min(16, Number(msg.size) || 2));
    const unit = msg.useTabs ? "\t" : " ".repeat(size);
    view.dispatch({
      effects: [
        indentCompartment.reconfigure(indentUnit.of(unit)),
        tabSizeCompartment.reconfigure(EditorStateTabSize.of(size)),
      ],
    });
  }

  function applyGotoLine(msg) {
    const lineNum = Math.max(1, Math.min(view.state.doc.lines, Number(msg.line) || 1));
    const line = view.state.doc.line(lineNum);
    const col = Math.max(0, Math.min(line.length, Number(msg.column) || 0));
    const pos = line.from + col;
    const sel = msg.select
      ? EditorSelection.range(line.from, line.to)
      : EditorSelection.cursor(pos);
    view.dispatch({
      selection: sel,
      effects: EditorView.scrollIntoView(pos, { y: "center" }),
    });
    view.focus();
  }

  // Insert text at the current selection (Insert Date & Time, TSK-299).
  // `replaceSelection` is the idiomatic CM6 insert: it's undoable, drops
  // the caret after the inserted text, and replaces any active selection.
  function applyInsertAtCursor(msg) {
    const text = typeof msg.text === "string" ? msg.text : "";
    if (!text) return;
    view.dispatch(view.state.replaceSelection(text));
    view.focus();
  }

  function applySetSelection(msg) {
    const len = view.state.doc.length;
    const anchor = Math.max(0, Math.min(len, Number(msg.anchor) || 0));
    const head = Math.max(0, Math.min(len, Number(msg.head) || 0));
    const spec = { selection: EditorSelection.range(anchor, head) };
    if (msg.scroll) spec.effects = EditorView.scrollIntoView(head, { y: "center" });
    view.dispatch(spec);
  }

  // ---- find / search ---------------------------------------------------
  // applySetSearchQuery: SwiftUI's find bar drives CM's search state
  // without opening the built-in panel. We mirror what
  // `openSearchPanel`'s field would do: dispatch `setSearchQuery` with
  // a fresh `SearchQuery`. Selection-match highlighting picks it up
  // through `highlightSelectionMatches` automatically.
  function applySetSearchQuery(msg) {
    const query = String(msg.query || "");
    const q = new SearchQuery({
      search: query,
      // `replace` seeds the find-and-replace string; `replaceNext` /
      // `replaceAll` read it off the active SearchQuery. When literal
      // (non-regex), CM substitutes the string verbatim; when regexp,
      // `$1` / `$&` capture-group refs are honored.
      replace: String(msg.replace || ""),
      caseSensitive: !!msg.caseSensitive,
      regexp: !!msg.regex,
      literal: !msg.regex,
    });
    view.dispatch({ effects: setSearchQuery.of(q) });
    emitFindResult();
  }

  // Apply a find-step command (findNext / findPrevious / replaceNext)
  // and post the match-count readout afterwards. Wrapper exists so
  // every step keeps the SwiftUI find bar's n/N in sync without polling.
  function applyFindStep(fn) {
    fn(view);
    emitFindResult();
  }

  // Count matches for the current query and post a `findResultChanged`
  // event so the SwiftUI find bar can render n/N. Done in JS because
  // CM6's matcher already knows how to honor case/regex/word options;
  // re-implementing in Swift would drift.
  function emitFindResult() {
    try {
      const q = getSearchQuery(view.state);
      if (!q || !q.search) {
        post("findResultChanged", { matches: 0, current: 0 });
        return;
      }
      const cursor = q.getCursor(view.state.doc);
      const matches = [];
      // SearchCursor is iterator-shaped (`next()` returns `{value:{from,to}, done}`).
      // For huge docs this could be expensive; cap at a reasonable count
      // so the bar UX stays responsive and we don't lock up the WebView
      // process. 10k matches is the conventional editor ceiling.
      const MAX = 10000;
      let safety = 0;
      while (safety++ < MAX) {
        const step = cursor.next();
        if (step.done) break;
        matches.push(step.value);
      }
      const head = view.state.selection.main.head;
      let current = 0;
      for (let i = 0; i < matches.length; i++) {
        if (matches[i].from <= head && head <= matches[i].to) {
          current = i + 1;
          break;
        }
      }
      // If caret is past all matches but matches exist, mark the last
      // visited one (CM's default; users expect "current" to track the
      // most-recent jump).
      if (current === 0 && matches.length > 0) {
        for (let i = 0; i < matches.length; i++) {
          if (matches[i].from >= head) { current = Math.max(1, i); break; }
        }
        if (current === 0) current = matches.length;
      }
      post("findResultChanged", { matches: matches.length, current: current });
    } catch (e) {
      post("errorOccurred", {
        phase: "findResult",
        message: String((e && e.message) || e),
      });
    }
  }

  // ---- diagnostics -----------------------------------------------------
  // Translate the bridge `setDiagnostics` payload into CM6 `Diagnostic`
  // records and dispatch them through @codemirror/lint's setDiagnostics
  // effect. Clears (empty array) work the same way.
  function applySetDiagnostics(msg) {
    const arr = Array.isArray(msg.diagnostics) ? msg.diagnostics : [];
    const docLen = view.state.doc.length;
    const diags = [];
    for (const d of arr) {
      const from = Math.max(0, Math.min(docLen, Number(d.from) || 0));
      const to = Math.max(from, Math.min(docLen, Number(d.to) || from));
      if (to === from) continue; // skip zero-length (CM6 ignores them)
      diags.push({
        from: from,
        to: to,
        severity: mapSeverity(d.severity),
        message: String(d.message || ""),
        source: d.source ? String(d.source) : undefined,
      });
    }
    view.dispatch(setDiagnostics(view.state, diags));
  }

  function mapSeverity(s) {
    // CM6 lint accepts "error" | "warning" | "info" | "hint".
    switch ((s || "").toLowerCase()) {
      case "error":   return "error";
      case "warning": return "warning";
      case "info":    return "info";
      case "hint":    return "hint";
      default:        return "error";
    }
  }

  // ---- invisibles toggle ----------------------------------------------
  function applySetShowInvisibles(msg) {
    view.dispatch({
      effects: invisiblesCompartment.reconfigure(invisiblesExtension(!!msg.enabled)),
    });
  }

  // ---- find panel emit on open/close ----------------------------------
  // Listen for CM's panel mount/unmount via the panel container DOM —
  // simpler than wiring into the SearchQuery facet. The SwiftUI find
  // bar doesn't use this for now (it drives via setSearchQuery), but
  // user-triggered ⌘F still opens the built-in panel and we want to
  // be honest about it.
  let _findPanelMounted = false;
  function _checkFindPanel() {
    const mounted = !!document.querySelector(".cm-panel.cm-search");
    if (mounted !== _findPanelMounted) {
      _findPanelMounted = mounted;
      post(mounted ? "findOpened" : "findClosed", mounted ? { query: "" } : {});
    }
  }
  const _findObserver = new MutationObserver(_checkFindPanel);
  _findObserver.observe(document.body, { childList: true, subtree: true });

  // ---- legacy untyped helpers (kept for one cycle) ---------------------
  // Existing Swift call sites use window.setText / setTheme / etc. These
  // shims preserve that surface so callers can migrate to cmDispatch at
  // their own pace. Remove once every Swift caller routes via
  // CodeMirrorEditorView's new bridge.
  window.setText      = function (t) { applySetText({ text: t, resetHistory: false, preserveSelection: true }); };
  window.getText      = function () { return view.state.doc.toString(); };
  window.undo         = function () { return undo(view); };
  window.redo         = function () { return redo(view); };
  window.openSearch   = function () { openSearchPanel(view); return true; };
  window.setFontSize  = function (px) { applySetFontSize({ px: px }); };
  window.setFontFamily = function (f) { applySetFontFamily({ family: f }); };
  window.setTheme     = function (n)  { applySetTheme({ name: n }); };
  window.setLanguage  = function (l)  { applySetLanguage({ lang: l }); };
  window.setEditable  = function (y)  { applySetReadOnly({ enabled: !y }); };
  window.flushChanges = function ()   { emitChangeImmediate(); };

  // Tell Swift we're alive and ready. Swift caches the "ready" state
  // because evaluateJavaScript before load completion silently no-ops.
  post("ready", { version: PROTOCOL_VERSION });
})();
</script>
</body>
</html>
