name: PR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Merge/PR gate — HEADLESS tiers only.
#
# This job runs the headless test pyramid (T1 / T1m / T2'): ViewerKitTests +
# ViewerCoreTests + the HeadlessUITestCase-based ViewerUITests, via the bare
# `swift test` sweep (which now completes — the heavy tiers self-skip with no
# bundle / no GUI session). It does NOT build or run against `dist/TextView.app`,
# so the heavy tiers physically cannot run their bodies here:
#   - LiveAppTestCase (T4) — XCTSkips (LaunchHarness.isAppBuilt == false)
#   - PixelTestCase   (T5) — XCTSkips (no app + no Screen-Recording)
# Those run for real in the SEPARATE VM / nightly lane (scripts/test-in-vm.sh),
# which is local-only (the UTM macOS VM isn't a GitHub-hosted runner).
#
# Tier enforcement: scripts/test-headless-gate.sh arms MDV_HEADLESS_GATE=1, and
# the in-process TierGateObserver fails the gate if any LiveAppTestCase /
# PixelTestCase subclass RUNS its body instead of skipping — so "headless"
# can't silently regress (tier is the type, checked at runtime).
jobs:
  headless-gate:
    # Runner must match the app's deployment target (macOS 15+, see
    # Package.swift `platforms: [.macOS(.v15)]`). macos-14 cannot run a
    # macOS-15-targeted .app and silently masks v15-only API misuse.
    name: Headless gate (macOS 15)
    runs-on: macos-15
    env:
      # Pin CARGO_TARGET_DIR to a workspace-relative, already-gitignored path
      # (`.build/` is in .gitignore) so the actions/cache step below can capture
      # the Rust build dir. build-rust-core.sh uses `${CARGO_TARGET_DIR:-...}`,
      # so this override wins over its ephemeral /private/tmp default — that
      # default lives outside the workspace and is invisible to actions/cache.
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build/rust-target
    steps:
      - uses: actions/checkout@v4

      # Build caches — the merge gate otherwise cold-compiles the entire SwiftPM
      # dependency graph (swift-markdown, swift-cmark, SwiftTreeSitter, the
      # tree-sitter runtime + grammar packages) AND the full Rust dependency
      # tree on every run, including no-op doc commits. Each cache is keyed on
      # its lockfile so it invalidates only when dependencies actually change.
      - name: Cache SwiftPM build (.build)
        uses: actions/cache@v4
        with:
          # Exclude the Rust target dir (cached separately below, keyed on
          # Cargo.lock) so the two caches stay disjoint — otherwise the Rust
          # tree, which lives under .build/, would be double-archived into this
          # SwiftPM cache under the wrong key.
          path: |
            .build
            !.build/rust-target
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Rust target dir
        uses: actions/cache@v4
        with:
          path: .build/rust-target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      # macos-15 ships Xcode 16.x as the default toolchain (Swift 6).
      # Pin explicitly so a runner-image bump can't silently swap the
      # Swift version under us.
      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Swift version
        run: swift --version

      # The RustCore target static-links libmdvcore_ffi.a (built by cargo);
      # it must exist before any `swift build`. GitHub macOS runners ship
      # rustup/cargo pre-installed. (build-app.sh + the gate script also
      # build it; this covers the standalone compile-check step below.)
      - name: Build Rust core (mdvcore staticlib)
        run: bash scripts/build-rust-core.sh

      # Enforce the core's no-panic lint policy (clippy denies indexing_slicing /
      # panic / unwrap_used / expect_used) and run the pure cargo tests. Nothing
      # was invoking clippy/test on the workspace before, so those denies were
      # dead letters.
      - name: Rust-core gate (clippy deny + cargo test)
        run: bash scripts/rust-core-gate.sh

      - name: Build
        run: swift build -v

      # The gate: headless tiers + machine-checked tier enforcement.
      # The script runs `MDV_HEADLESS_GATE=1 swift test --parallel`, then fails
      # the build if EITHER a test failed OR a heavy-tier test ran its body
      # (TierGateObserver sentinel). The heavy T4/T5 tiers self-skip here.
      - name: Headless gate (swift test + tier enforcement)
        run: bash scripts/test-headless-gate.sh

      # Bundle assembly is a separate compile/packaging check — NOT used to
      # run the heavy tiers (those stay in the VM lane). Kept here so a broken
      # build-app.sh / Info.plist / size-budget regression is still caught at
      # PR time.
      - name: Assemble .app bundle
        run: bash scripts/build-app.sh debug

      - name: Verify .app bundle
        run: bash scripts/verify-app.sh

  # Supply-chain gate (TSK-975) — cargo-deny (licenses / bans / sources) +
  # cargo-audit (RustSec advisories) over rust-core, via the SAME script the
  # nightly lane and a developer run locally (scripts/rust-supply-chain-audit.sh).
  #
  # Why this MUST be a PR gate, not nightly-only: before this, a PR that pulled
  # in a CVE-affected transitive dep, a crate with a banned license, an unknown
  # registry/git source, or a yanked version sailed through the merge gate and
  # was only caught by `nightly-supply-chain.yml` HOURS AFTER it landed on main.
  # The supply chain is exactly the surface we want to block at review time —
  # so the audit runs per-PR here and stays a hard, blocking failure.
  #
  # Lockfile-level scanning is platform-independent (deny.toml pins the dependency
  # GRAPH targets to the macOS triples we actually build), so this runs on the
  # cheap ubuntu runner in PARALLEL with headless-gate above — it does not add
  # macOS-runner minutes or serialize behind the Swift build.
  #
  # Deliberately NO third-party setup actions (the supply-chain lane should not
  # itself widen the supply chain): the tools are `cargo install --locked`,
  # cached by version key — mirrors nightly-supply-chain.yml exactly.
  supply-chain-gate:
    name: Supply-chain gate (cargo-deny + cargo-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache audit tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-audit
          key: audit-tools-${{ runner.os }}-deny0.18-audit0.22

      - name: Install tools (cache miss only)
        run: |
          command -v cargo-deny  >/dev/null || cargo install --locked cargo-deny
          command -v cargo-audit >/dev/null || cargo install --locked cargo-audit

      - name: Run supply-chain audit
        run: bash scripts/rust-supply-chain-audit.sh
