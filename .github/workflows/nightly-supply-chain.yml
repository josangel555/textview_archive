# Nightly supply-chain audit (TSK-554): cargo-deny (licenses/bans/sources)
# + cargo-audit (advisories) over rust-core, via the same script a developer
# runs locally. Lockfile-level scanning — platform-independent, so the cheap
# Linux runner is fine (deny.toml pins the dependency GRAPH targets itself).
#
# Deliberately NO third-party setup actions (the supply-chain lane should
# not widen the supply chain): the tools are `cargo install --locked`,
# cached by version key.
name: nightly-supply-chain

on:
  schedule:
    - cron: "23 7 * * *"   # 07:23 UTC nightly (off the :00 stampede)
  workflow_dispatch: {}

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache audit tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-audit
          key: audit-tools-${{ runner.os }}-deny0.18-audit0.22

      - name: Install tools (cache miss only)
        run: |
          command -v cargo-deny  >/dev/null || cargo install --locked cargo-deny
          command -v cargo-audit >/dev/null || cargo install --locked cargo-audit

      - name: Run supply-chain audit
        run: bash scripts/rust-supply-chain-audit.sh
