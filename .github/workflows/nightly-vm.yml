name: Nightly VM lane (heavy tiers)

# HEAVY tiers — the separate VM / nightly lane, NOT the merge gate.
#
# Runs the tiers that need a real app bundle and a real GUI session, which the
# headless PR gate (pr.yml) deliberately skips:
#   - LiveAppTestCase (T4): spawns dist/TextView.app via --script, reads JSON
#     dumps back — verifies the AppDelegate↔coordinator launch wiring + the
#     cross-process persistence that only exists in a real process.
#   - PixelTestCase   (T5): SourceViewVisualRegressionTests — reads composited
#     WindowServer pixels via screencapture(1). The sole irreducibly-real-screen
#     suite; needs a GUI login session + TCC Screen-Recording grant.
#   - The in-process live-WKWebView suites, run with MDV_RUN_WEBVIEW_TESTS=1
#     (process-isolated from the bare sweep — see #192 / WebViewTestTeardown).
#
# Environment: these CANNOT run on a GitHub-hosted `macos-15` runner — they need
# a GUI login session (WindowServer) + Screen-Recording TCC grant. They run on
# the project's UTM macOS VM, registered as a SELF-HOSTED runner with the
# `macos-vm` label. Until such a runner is registered, this workflow is a no-op
# that documents the lane; locally the same lane is driven by
# `scripts/test-in-vm.sh` over SSH (see CLAUDE.md "VM workflow").
#
# Note: this lane is intentionally NOT a required check on PRs — it's nightly +
# manual. A red nightly is investigated, not a merge blocker.

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC nightly
  workflow_dispatch: {}

jobs:
  vm-heavy:
    name: Heavy tiers (T4/T5 + WebView) — self-hosted macOS VM
    # Self-hosted UTM macOS VM with a live GUI session. Skips cleanly on forks /
    # before a runner is registered.
    runs-on: [self-hosted, macos-vm]
    if: ${{ github.repository_owner != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      # Build the bundle the heavy tiers need, then run the FULL suite
      # (headless + T4 + T5). test-in-vm.sh builds dist/TextView.app, runs
      # `swift test`, and emits JUnit XML at /tmp/mdv-test-results.xml.
      - name: Build + full suite (headless + T4/T5)
        env:
          # Varying-seed nightly exploration for the differential parity fuzzes
          # (TSK-1125): each nightly run gets a distinct seed base, so the Formula/
          # Fuzzy/Find/Transcript fuzzes cover NEW regions of the input space over
          # time. test-in-vm.sh forwards MDV_* over ssh into the VM swift test. The
          # merge gate leaves this UNSET → seed base 0 → the deterministic fixed-seed
          # corpus (the regression guard). A nightly red logs its concrete inputs.
          MDV_FUZZ_SEED_BASE: ${{ github.run_number }}
        run: bash scripts/test-in-vm.sh all

      # The in-process live-WKWebView suites — process-isolated from the bare
      # sweep (#192). Run them in their own invocation with the gate armed so a
      # heavy-tier regression here is still caught; these suites are NOT
      # LiveAppTestCase/PixelTestCase subclasses, so the observer leaves them
      # alone — it only fails on a T4/T5 body running in a *headless* context,
      # which this isn't.
      - name: WebView lane (MDV_RUN_WEBVIEW_TESTS)
        run: |
          ulimit -n 16384 2>/dev/null || ulimit -n 8192 2>/dev/null || true
          # SERIAL (no --parallel): each live-WKWebView suite realizes WebContent+
          # GPU+Networking helper processes (many fds each); parallel xctest workers
          # multiply that past the open-files limit → an EMFILE "Too many open files"
          # cascade of FALSE file-IO failures (TSK-1236, fd-exhaustion class of
          # TSK-500). Serial bounds the live WKWebViews to one suite at a time.
          # Keep this filter list in sync with scripts/test-in-vm.sh's webview lane
          # (one canonical set of #192-gated suites). A gated suite absent from BOTH
          # lanes runs nowhere → its green means nothing (the TSK-621 trap).
          MDV_RUN_WEBVIEW_TESTS=1 swift test \
            --filter ViewerUITests.ComponentVisualTests \
            --filter ViewerUITests.ContentViewHostingTests \
            --filter ViewerUITests.DiagnosticDumpTests \
            --filter ViewerUITests.EditorReplaceWebViewTests \
            --filter ViewerUITests.EditorThemeParityTests \
            --filter ViewerUITests.BlameGutterWebViewTests \
            --filter ViewerUITests.FindBarTests \
            --filter ViewerUITests.FormatToggleTests \
            --filter ViewerUITests.FoldGutterWebViewTests \
            --filter ViewerUITests.EditorDiagnosticsWebViewTests \
            --filter ViewerUITests.EditorCompletionWebViewTests \
            --filter ViewerUITests.SettingsTerminalColorSchemeHostingTests \
            --filter ViewerUITests.SidebarFilesToggleHostingTests \
            --filter ViewerUITests.ShoulderRailEmptyHidingHostingTests \
            --filter ViewerUITests.AudioPlayerHostIntegrationTests \
            --filter ViewerUITests.EmptyStateNewImageHostingTests \
            --filter ViewerUITests.ConvertImageHostingTests \
            --filter ViewerUITests.AudioConvertHostingTests \
            --filter ViewerUITests.CM6PlainClickAfterScrollWebViewTests \
            --filter ViewerUITests.WalkthroughMermaidRenderWebViewTests \
            --filter ViewerUITests.WalkthroughDiagramOverlayMountTests \
            --filter ViewerUITests.FeedReaderViewRenderTests \
            --filter ViewerUITests.ImageElementPropertiesPanelRenderTests \
            --filter ViewerUITests.MermaidHostingTests \
            --filter ViewerUITests.MermaidRenderProbeTests \
            --filter ViewerUITests.MultiCursorWebViewTests \
            --filter ViewerUITests.PaneRetentionMountProbeTests \
            --filter ViewerUITests.PDFExportWebViewTests \
            --filter ViewerUITests.PaneScrollRestoreWebViewTests \
            --filter ViewerUITests.EditorScrollRestoreWebViewTests \
            --filter ViewerUITests.EditorCursorBlinkWebViewTests \
            --filter ViewerUITests.BlockPatchApplyWebViewTests \
            --filter ViewerUITests.BlockPatchAlignmentProbeTests \
            --filter ViewerUITests.DiffWebPageTests \
            --filter ViewerUITests.MathRenderWebViewTests \
            --filter ViewerUITests.CanvasPatchLoopWebViewTests \
            --filter ViewerUITests.CanvasTabMountWebViewTests \
            --filter ViewerUITests.CanvasSelectionWebViewTests \
            --filter ViewerUITests.CanvasInlineEditWebViewTests \
            --filter ViewerUITests.CanvasDragReorderWebViewTests \
            --filter ViewerUITests.CanvasUATM3Tests \
            --filter ViewerUITests.RenderedFindBarTests \
            --filter ViewerUITests.RenderedFindClearWebViewTests \
            --filter ViewerUITests.ScriptConsoleHostingTests \
            --filter ViewerUITests.StructuralSearchHostingTests \
            --filter ViewerUITests.SpreadsheetViewHostingTests \
            --filter ViewerUITests.TaskRunnerHostingTests \
            --filter ViewerUITests.TerminalCommandPaletteHostingTests \
            --filter ViewerUITests.WalkthroughDiagramOverlayHostingTests \
            --filter ViewerUITests.WalkthroughMermaidWebViewHostingTests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-test-results
          path: /tmp/mdv-test-results.xml
          if-no-files-found: ignore
